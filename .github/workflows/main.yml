name: Android 14 ARM Rooted
on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Start Android 14 ARM64 (Rooted)
        run: |
          docker run -itd --rm --privileged \
            -p 5555:5555 \
            redroid/redroid:14.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320

      - name: Build Native ARM64 Web Screen & Link
        run: |
          sleep 35
          sudo apt-get update && sudo apt-get install -y adb nodejs npm
          adb connect localhost:5555
          gh repo clone NetrisTV/ws-scrcpy
          cd ws-scrcpy
          npm install
          npm run dist
          nohup npm start > /dev/null 2>&1 &
          sleep 5
          npx -y localtunnel --port 8000 > link.txt 2>&1 &
          sleep 10
          echo "=========================================="
          echo "افتح هذا الرابط للدخول إلى الأندرويد:"
          cat link.txt
          echo "=========================================="
          sleep 21000

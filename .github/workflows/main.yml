name: Android ARM Cloud
on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Start Android 12 ARM64
        run: |
          docker run -itd --rm --privileged \
            -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320

      - name: Start Web Screen & Tunnel
        run: |
          sleep 30
          sudo apt-get update && sudo apt-get install -y adb curl
          adb connect localhost:5555
          docker run -d --net=host --platform linux/amd64 scavin/ws-scrcpy
          curl -fsSL https://cloudflare.com | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://cloudflare.com any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared
          cloudflared tunnel --url http://localhost:8000 &
          sleep 21000

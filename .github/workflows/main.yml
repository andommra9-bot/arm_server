name: Android ARM Rooted
on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Enable Kernel Modules & Start Android ARM64
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          docker run -itd --name android --privileged \
            --net=host \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320
          sleep 20
          docker ps -a

      - name: Build Native ARM64 Web Screen & Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y adb nodejs npm
          gh repo clone NetrisTV/ws-scrcpy
          cd ws-scrcpy
          npm install
          npm run dist
          adb connect 127.0.0.1:5555
          adb devices
          node dist/index.js > server.log 2>&1 &
          sleep 15
          npx -y localtunnel --port 8000 --local-host 127.0.0.1 > link.txt 2>&1 &
          sleep 10
          echo "=========================================="
          echo "افتح هذا الرابط للدخول إلى الأندرويد:"
          cat link.txt
          echo "=========================================="
          sleep 21000

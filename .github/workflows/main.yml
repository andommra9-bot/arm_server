name: Android ARM Cloud
on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Start Android 12 ARM64
        run: |
          docker run -itd --rm --privileged \
            -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320

      - name: Start Web Screen & Get Link
        run: |
          sleep 20
          sudo apt-get update && sudo apt-get install -y adb
          adb connect localhost:5555
          docker run -d --net=host --platform linux/amd64 scavin/ws-scrcpy
          sudo snap install cloudflared
          cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          sleep 10
          echo "=========================================="
          echo "رابط شاشة الأندرويد الخاص بك هو:"
          grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="
          sleep 21000
